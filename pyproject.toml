[tool.poetry]
name = "plunkylib"
version = "0.1.6"
description = "plunkylib - Python LLM User Navigation Kit via YAML"
authors = ["Mattie Casper"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
snapclass = "^0.1.2"
python-dotenv = ">=1.2.2,<2.0"
loguru = "^0.6.0"
nest-asyncio = "^1.5.6"
openai = "^0.27.2"
typer = "^0.27.3"

# Wheel installs do not use poetry.lock, so enforce security fixes here too.
aiohttp = ">=3.14.4,<4.0"
requests = ">=2.33.0,<3.0"
urllib3 = ">=2.8.0,<3.0"
certifi = ">=2026.10.19"
idna = ">=3.15,<4.0"
tqdm = ">=4.66.3,<5.0"
multidict = ">=6.9.1,<8.0"

[tool.poetry.dev-dependencies]
pytest = "^9.1"
pytest-asyncio = "^0.21.0"

[tool.poetry.scripts]
plunky = "plunkylib.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

